<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grund Digital Archive</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1b18; --muted: #5f5a52; --line: #ddd7cc; --accent: #6b4f2a; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181715; --fg: #ece8e1; --muted: #a79f93; --line: #3a3631; --accent: #d9b27a; --card: #211f1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .3rem; font-weight: 650; }
  h2 { font-size: 1.05rem; margin: 2.2rem 0 .4rem; }
  a { color: var(--accent); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.3rem; margin: 1rem 0; }
  .card p { margin: .4rem 0; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input { font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em;
          text-transform: uppercase; padding: .5rem .7rem; width: 11rem; border: 1px solid var(--line);
          border-radius: 8px; background: var(--card); color: var(--fg); }
  button { font: inherit; padding: .5rem 1.1rem; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--bg); cursor: pointer; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  footer { color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1rem; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Grund Digital Archive</h1>

  <h2>Look up a code</h2>
  <form id="lookup">
    <label for="code" class="visually-hidden">Code</label>
    <input id="code" name="code" placeholder="XFETYZ" autocomplete="off" spellcheck="false" maxlength="40">
    <button type="submit">Look up</button>
  </form>

    <h2>About</h2>
  <p>Every code has a permanent web address: <code>https://w3id.org/gda/</code> followed by
    the code, for example <a href="https://w3id.org/gda/XFETYZ">https://w3id.org/gda/XFETYZ</a></p>

</main>
<script>
  document.getElementById("lookup").addEventListener("submit", (event) => {
    event.preventDefault();
    const value = document.getElementById("code").value.trim();
    if (value) location.href = "/" + encodeURIComponent(value);
  });
</script>
</body>
</html>
